[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "psycho-rl"
version = "0.1.0"
description = "Psycho: an RLGym v2 PPO bot for Rocket League"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
authors = [{ name = "caleb stark" }]
dependencies = [
    "gym==0.26.2",
    "numpy==1.26.4",
    "rlbot==2.0.0b52",
    "rlgym-api==2.0.0",
    "rlgym-ppo @ git+https://github.com/AechPro/rlgym-ppo.git@4ffd2e924198bf4b2d59f4bf280b29919d7c07ea",
    "rlgym-rlbot[rocketsim]==0.3.0",
    "rlgym-rocket-league[sim]==2.0.1",
    "rocketsim==2.2.1",
    "torch==2.15.0",
    "wandb==0.30.0",
]

[project.urls]
Repository = "https://github.com/caleb-stark/psycho"

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[tool.setuptools.packages.find]
include = ["psycho*", "training*", "bot*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
